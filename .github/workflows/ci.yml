name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (tsc --noEmit type-check)
        run: npm run lint

      - name: Run unit tests
        run: npm test -- --run

      - name: Build check (vite build)
        run: npm run build

      - name: Security audit (high/critical)
        run: npm audit --audit-level=high

  # Optional: separate job for coverage/upload if needed
  # coverage:
  #   runs-on: ubuntu-latest
  #   needs: lint-typecheck-test
  #   steps:
